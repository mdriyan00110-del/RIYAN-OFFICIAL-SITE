<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Diamond TopUp - RIYAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-fire-flame-curved text-orange-500 text-2xl"></i>
                <span class="text-lg font-bold text-orange-400">RIYAN FF TOPUP</span>
            </div>
            <span class="bg-green-500/20 text-green-400 text-xs px-2.5 py-1 rounded-full border border-green-500/30">
                <i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i> Active
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 py-6 space-y-5">

        <!-- Banner -->
        <div class="bg-gradient-to-r from-orange-600 via-amber-600 to-yellow-500 rounded-2xl p-5 text-center shadow-lg">
            <h1 class="text-2xl font-black uppercase text-slate-950 tracking-wider">Free Fire Diamond</h1>
            <p class="text-slate-900 text-xs font-semibold mt-1">ইউআইডি (UID) দিয়ে দ্রুত ও নিরাপদ টপ-আপ</p>
        </div>

        <!-- UID Input -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <label class="block text-sm font-semibold text-orange-400 mb-2">
                ১. প্লেয়ার ইউআইডি (Player UID)
            </label>
            <input type="number" id="playerUid" placeholder="এখানে UID দিন (যেমন: 123456789)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
        </div>

        <!-- Diamond Packages -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <label class="block text-sm font-semibold text-orange-400 mb-3">
                ২. ডায়মন্ড প্যাকেজ বেছে নিন
            </label>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="selectPkg(this, '25 Diamond', '20')" class="pkg-card cursor-pointer bg-slate-950 border border-slate-800 hover:border-orange-500 p-3 rounded-xl text-center transition">
                    <div class="text-orange-400 font-bold">💎 25 Diamond</div>
                    <div class="text-slate-400 text-xs mt-1">৳ 20 BDT</div>
                </div>
                <div onclick="selectPkg(this, '115 Diamond', '80')" class="pkg-card cursor-pointer bg-slate-950 border border-slate-800 hover:border-orange-500 p-3 rounded-xl text-center transition">
                    <div class="text-orange-400 font-bold">💎 115 Diamond</div>
                    <div class="text-slate-400 text-xs mt-1">৳ 80 BDT</div>
                </div>
                <div onclick="selectPkg(this, '240 Diamond', '160')" class="pkg-card cursor-pointer bg-slate-950 border border-slate-800 hover:border-orange-500 p-3 rounded-xl text-center transition">
                    <div class="text-orange-400 font-bold">💎 240 Diamond</div>
                    <div class="text-slate-400 text-xs mt-1">৳ 160 BDT</div>
                </div>
                <div onclick="selectPkg(this, '610 Diamond', '400')" class="pkg-card cursor-pointer bg-slate-950 border border-slate-800 hover:border-orange-500 p-3 rounded-xl text-center transition">
                    <div class="text-orange-400 font-bold">💎 610 Diamond</div>
                    <div class="text-slate-400 text-xs mt-1">৳ 400 BDT</div>
                </div>
                <div onclick="selectPkg(this, 'Weekly Membership', '170')" class="pkg-card cursor-pointer bg-slate-950 border border-slate-800 hover:border-orange-500 p-3 rounded-xl text-center transition col-span-2">
                    <div class="text-yellow-400 font-bold">👑 Weekly Membership</div>
                    <div class="text-slate-400 text-xs mt-1">৳ 170 BDT</div>
                </div>
            </div>
        </div>

        <!-- Payment Method -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <label class="block text-sm font-semibold text-orange-400 mb-3">
                ৩. পেমেন্ট মেথড
            </label>
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center space-x-2">
                    <input type="radio" name="payMethod" value="bKash" class="accent-orange-500">
                    <span class="text-sm font-medium text-pink-500">bKash (বিকাশ)</span>
                </label>
                <label class="cursor-pointer bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center space-x-2">
                    <input type="radio" name="payMethod" value="Nagad" class="accent-orange-500">
                    <span class="text-sm font-medium text-orange-500">Nagad (নগদ)</span>
                </label>
            </div>
        </div>

        <!-- Submit Button -->
        <button onclick="handleOrder()" class="w-full bg-orange-500 hover:bg-orange-600 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg transition uppercase tracking-wider">
            অর্ডার কনফার্ম করুন
        </button>

    </main>

    <script>
        let chosenPkg = null;

        function selectPkg(el, name, price) {
            document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('border-orange-500', 'bg-orange-500/10'));
            el.classList.add('border-orange-500', 'bg-orange-500/10');
            chosenPkg = { name, price };
        }

        function handleOrder() {
            const uid = document.getElementById('playerUid').value.trim();
            const pay = document.querySelector('input[name="payMethod"]:checked');

            if (!uid) return alert('দয়া করে আপনার ফ্রী ফায়ার UID দিন!');
            if (!chosenPkg) return alert('একটি ডায়মন্ড প্যাকেজ নির্বাচন করুন!');
            if (!pay) return alert('পেমেন্ট মাধ্যম সিলেক্ট করুন!');

            alert(`অর্ডার সফল হয়েছে!\n\nPlayer UID: ${uid}\nPackage: ${chosenPkg.name} (${chosenPkg.price} Tk)\nPayment Method: ${pay.value}\n\nধন্যবাদ! খুব দ্রুত ডায়মন্ড ডেলিভারি দেওয়া হবে।`);
        }
    </script>
</body>
</html>
